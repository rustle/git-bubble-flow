name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here needs to write to the repository, and a
# token that cannot write cannot be turned into a supply-chain foothold.
permissions:
  contents: read

jobs:
  linux:
    name: Linux (container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker compose build dev
      - name: Unit tests
        run: docker compose run --rm dev swift test
      - name: Conformance suite
        run: docker compose run --rm dev ./test/run-tests.sh

  macos:
    name: macOS (native)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install bats-core git-absorb
      - run: swift test
      # release, not debug: the linkage guard skips on a debug build, so the
      # shipped shape would otherwise never be asserted anywhere in CI.
      - run: CONFIGURATION=release ./test/run-tests.sh

  static:
    name: Static Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cross-compile both arches
        run: make static
      - name: Smoke-test on bare musl
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" alpine:3 \
            /d/git-bubble-flow-linux-x86_64 --version
      - name: Conformance against the static binary
        # Asserts the shipped linkage shape, which the debug lanes skip.
        run: |
          docker compose run --rm \
            -e BUBBLE_FLOW_BINARY=/workspace/dist/git-bubble-flow-linux-x86_64 \
            dev ./test/run-tests.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-bubble-flow-linux
          path: dist/
